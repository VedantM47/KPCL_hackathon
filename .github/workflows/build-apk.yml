name: Build Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9 is installed by the action, so the repo does not need a committed wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KPCL-Plant-Alert.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KPCL-Plant-Alert-apk
          path: KPCL-Plant-Alert.apk
          if-no-files-found: error

      # Tag a commit (git tag v1.0 && git push --tags) to also publish the APK as a downloadable release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KPCL-Plant-Alert.apk
